---
layout: default
---

<article class="technique">
    <header class="technique-header">
        <nav class="breadcrumb">
            <a href="{{ '/' | relative_url }}">Home</a> &gt;
            <a href="{{ '/techniques/' | relative_url }}">Techniques</a> &gt;
            <span>{{ page.title }}</span>
        </nav>
        <h1>{{ page.title }}</h1>
        {% if page.description %}
        <p class="technique-description">{{ page.description }}</p>
        {% endif %}
    </header>

    <div class="technique-content">
        {{ content }}
    </div>

    <footer class="technique-footer">
        <a href="{{ '/' | relative_url }}" class="btn btn-primary">← Back to Techniques Table</a>
    </footer>
</article>
