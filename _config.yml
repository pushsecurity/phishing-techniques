title: Phishing Detection Evasion Techniques
description: A collection of phishing techniques used to evade detection from Push Security.
baseurl: "/phishing-techniques"
url: "https://pushsecurity.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /techniques/:title/

# Collections
collections:
  techniques:
    output: true
    permalink: /techniques/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "techniques"
    values:
      layout: "technique"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/